name: Dangerfile

# RagFit fork: automatic triggers are DISABLED, not deleted. Lines prefixed "#RAGFIT-OFF# " are the
# original upstream triggers. Re-enable: `just ci-triggers on <file>` (removes the prefix). See README-RAGFIT-CI.md.
on:
  workflow_dispatch:
#RAGFIT-OFF#   pull_request:
#RAGFIT-OFF#     types: [opened, reopened, synchronize]
#RAGFIT-OFF#     paths-ignore:
#RAGFIT-OFF#       - "docs/**"
#RAGFIT-OFF#       - "help/**"
#RAGFIT-OFF#       - "packaging/**"
#RAGFIT-OFF#       - ".pkgr.yml"

jobs:
  danger:
    if: github.repository_owner == 'opf'
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Setup danger
        run: |
          gem install danger
      - name: Run inconsistent translations check
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          danger --verbose
