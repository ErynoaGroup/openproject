name: Yamllint

# RagFit fork: automatic triggers are DISABLED, not deleted. Lines prefixed "#RAGFIT-OFF# " are the
# original upstream triggers. Re-enable: `just ci-triggers on <file>` (removes the prefix). See README-RAGFIT-CI.md.
on:
  workflow_dispatch:
#RAGFIT-OFF#   pull_request:
#RAGFIT-OFF#     paths:
#RAGFIT-OFF#       - '.yamllint.yml'
#RAGFIT-OFF#       - 'config/locales/en.yml'
#RAGFIT-OFF#       - 'config/locales/js-en.yml'
#RAGFIT-OFF#       - 'modules/*/config/locales/en.yml'
#RAGFIT-OFF#       - 'modules/*/config/locales/js-en.yml'

jobs:
  yamllint:
    name: Yamllint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Yamllint
        uses: reviewdog/action-yamllint@de68272fdca5f2a961fb309e0d2e13c2eb186d9e # v1.23.1
        with:
          reporter: github-pr-annotations
          fail_level: any
          yamllint_flags: >
            .yamllint.yml
            config/locales/en.yml
            config/locales/js-en.yml
            modules/*/config/locales/en.yml
            modules/*/config/locales/js-en.yml
