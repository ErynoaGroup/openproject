name: ERB lint

# RagFit fork: automatic triggers are DISABLED, not deleted. Lines prefixed "#RAGFIT-OFF# " are the
# original upstream triggers. Re-enable: `just ci-triggers on <file>` (removes the prefix). See README-RAGFIT-CI.md.
on:
  workflow_dispatch:
#RAGFIT-OFF#   pull_request:
#RAGFIT-OFF#     paths:
#RAGFIT-OFF#       - "**/*.erb"
#RAGFIT-OFF#       - ".erb_lint.yml"
#RAGFIT-OFF#       - ".erb_linters/**"

jobs:
  erb-lint:
    name: ERB lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true
      - name: Run ERB lint
        uses: opf/action-erblint@49c54b56c60d0c50885065468cf149b61d5c2a60 # main
        with:
          reporter: github-pr-annotations
          fail_level: any
          use_bundler: true
