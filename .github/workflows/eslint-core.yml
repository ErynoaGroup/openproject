name: ESLint

# RagFit fork: automatic triggers are DISABLED, not deleted. Lines prefixed "#RAGFIT-OFF# " are the
# original upstream triggers. Re-enable: `just ci-triggers on <file>` (removes the prefix). See README-RAGFIT-CI.md.
on:
  workflow_dispatch:
#RAGFIT-OFF#   pull_request:
#RAGFIT-OFF#     branches:
#RAGFIT-OFF#       - dev
#RAGFIT-OFF#       - release/*
#RAGFIT-OFF#     paths:
#RAGFIT-OFF#       - '**.html'
#RAGFIT-OFF#       - '**.js'
#RAGFIT-OFF#       - '**.ts'

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run ESLint
        uses: reviewdog/action-eslint@556a3fdaf8b4201d4d74d406013386aa4f7dab96 # v1
        with:
          reporter: github-pr-annotations
          fail_level: any
          workdir: 'frontend/'
          eslint_flags: 'src/'
