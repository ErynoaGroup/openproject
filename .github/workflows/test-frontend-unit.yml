name: "Frontend test suite"

# RagFit fork: automatic triggers are DISABLED, not deleted. Lines prefixed "#RAGFIT-OFF# " are the
# original upstream triggers. Re-enable: `just ci-triggers on <file>` (removes the prefix). See README-RAGFIT-CI.md.
on:
  workflow_dispatch:
#RAGFIT-OFF#   push:
#RAGFIT-OFF#     branches:
#RAGFIT-OFF#       - dev
#RAGFIT-OFF#       - release/*
#RAGFIT-OFF#     paths:
#RAGFIT-OFF#       - '**/frontend/**/*.ts'
#RAGFIT-OFF#       - '**/frontend/**/*.js'
#RAGFIT-OFF#       - '**/frontend/**/*.json'
#RAGFIT-OFF#       - '.github/workflows/test-frontend-unit.yml'

#RAGFIT-OFF#   pull_request:
#RAGFIT-OFF#     types: [opened, reopened, synchronize]
#RAGFIT-OFF#     paths:
#RAGFIT-OFF#       - '**/frontend/**/*.ts'
#RAGFIT-OFF#       - '**/frontend/**/*.js'
#RAGFIT-OFF#       - '**/frontend/**/*.json'
#RAGFIT-OFF#       - '.github/workflows/test-frontend-unit.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: ./frontend

jobs:
  playwright-version:
    name: Resolve Playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.lockfile.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: frontend/package-lock.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - id: lockfile
        run: echo "version=$(jq -r '.packages["node_modules/playwright"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  unit:
    name: Units (${{ matrix.browser }})
    needs: playwright-version
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci

      - name: Register plugins
        run: npm run ci:plugins:register_frontend

      - name: Take ownership of HOME
        # Actions points HOME at /github/home, owned by the image's pwuser, and
        # firefox refuses to launch as root under a home it does not own.
        run: chown root:root "$HOME"

      - name: Test
        run: npm test -- --browsers ${{ matrix.browser }} --reporters dot --reporters github-actions
