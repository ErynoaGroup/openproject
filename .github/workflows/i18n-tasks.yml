name: i18n-inconsistency-check

# RagFit fork: automatic triggers are DISABLED, not deleted. Lines prefixed "#RAGFIT-OFF# " are the
# original upstream triggers. Re-enable: `just ci-triggers on <file>` (removes the prefix). See README-RAGFIT-CI.md.
on:
  workflow_dispatch:
#RAGFIT-OFF#   push:
#RAGFIT-OFF#     branches:
#RAGFIT-OFF#       - dev
#RAGFIT-OFF#       - release/*
#RAGFIT-OFF#     paths-ignore:
#RAGFIT-OFF#       - "docs/**"
#RAGFIT-OFF#       - "help/**"
#RAGFIT-OFF#   pull_request:
#RAGFIT-OFF#     types: [opened, reopened, synchronize]
#RAGFIT-OFF#     paths-ignore:
#RAGFIT-OFF#       - "docs/**"
#RAGFIT-OFF#       - "help/**"
#RAGFIT-OFF#       - "packaging/**"
#RAGFIT-OFF#       - ".pkgr.yml"

permissions:
  contents: read

jobs:
  i18n-tasks:
    permissions:
      contents: read
    if: github.repository == 'opf/openproject'
    name: I18n inconsistency check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1

      - name: Setup i18n-tasks
        run: |
          gem install i18n-tasks

      - name: Run inconsistent translations check
        run: |
          i18n-tasks \
            check-consistent-interpolations \
            --config config/i18n-tasks-all-files.yml
