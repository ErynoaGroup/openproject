name: RagFit spec (oidc-admin-group)

# RagFit fork: runs only the RagFit specs (OIDC admin group, E2E user cleanup, Erynoa header) and checks the vendored
# Erynoa header package against its SHA256SUMS, on free GitHub-hosted runners.
# Allowed automatic trigger: pull_request limited to the paths below (see ragfit/ci/trigger-check.sh).
on:
  pull_request:
    paths:
      - "modules/openid_connect/**"
      - "ragfit/**"
      - "docker/prod/Dockerfile"
      - "app/services/ragfit/**"
      - "lib/tasks/ragfit_e2e.rake"
      - "spec/services/ragfit/**"
      - "public/erynoa/**"
      - "lib/open_project/ragfit/**"
      - "app/views/ragfit/**"
      - "app/views/layouts/base.html.erb"
      - "config/initializers/ragfit_erynoa_header.rb"
      - "spec/requests/ragfit/**"
      - "spec/lib/open_project/ragfit/**"
      - ".github/workflows/erynoa-spec.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erynoa-spec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leak-guard:
    # Without the internal-names secret (this workflow uses no secrets); the release guard in erynoa-build.yml
    # runs the same scan with it. The diff and commit-message scan must run (RAGFIT_LEAK_REQUIRE_BASE).
    name: leak guard (files, diff, commit messages)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck --severity=warning ragfit/ci/leak-guard.sh ragfit/ci/leak-guard-test.sh ragfit/ci/leak-base-fetch.sh
      - name: Leak guard tests
        run: ragfit/ci/leak-guard-test.sh
      - name: Leak guard
        env:
          RAGFIT_LEAK_REQUIRE_BASE: "true"
        run: |
          set -euo pipefail
          base=$(ragfit/ci/leak-base-fetch.sh)   # shallow checkout: fetch the upstream tag, deepen to the merge base
          ragfit/ci/leak-guard.sh "$base"

  precompress:
    name: precompress assets script
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install brotli
        run: sudo apt-get update && sudo apt-get install -y brotli
      - name: shellcheck
        run: shellcheck ragfit/build/precompress-assets.sh ragfit/ci/precompress-test.sh
      - name: precompress-test
        run: ragfit/ci/precompress-test.sh

  erynoa-header-sums:
    name: erynoa header package checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: sha256sum -c SHA256SUMS (public/erynoa/1.1.2)
        working-directory: public/erynoa/1.1.2
        run: |
          sha256sum --check --strict SHA256SUMS
          # every distributable file must be listed; only the package docs are outside SHA256SUMS
          listed=$(awk '{print $2}' SHA256SUMS | sort)
          present=$(find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name README.md ! -name CHANGELOG.md -printf '%f\n' | sort)
          [ "$listed" = "$present" ] || { echo "file list differs from SHA256SUMS"; diff <(echo "$listed") <(echo "$present"); exit 1; }
          grep -q 'erynoa-header-v1.1.2' README.md CHANGELOG.md

  spec:
    name: rspec ragfit specs
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d # 16 (index digest, 2026-10-13)
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/openproject_test
      BUNDLE_WITHOUT: development
      SILENCE_SQL_LOGS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Setup Ruby (.ruby-version)
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true

      - name: Configure database
        run: |
          cat > config/database.yml <<'YAML'
          test:
            url: <%= ENV["DATABASE_URL"] %>
          YAML

      - name: Create and migrate test database
        run: bundle exec rails db:create db:migrate

      - name: rspec
        run: >-
          bundle exec rspec
          modules/openid_connect/spec/lib/open_project/openid_connect/ragfit_admin_group_spec.rb
          modules/openid_connect/spec/lib/open_project/openid_connect/ragfit_login_gate_spec.rb
          modules/openid_connect/spec/lib/open_project/openid_connect/ragfit_revoke_ungated_spec.rb
          spec/services/ragfit/e2e_user_cleanup_spec.rb
          spec/lib/open_project/ragfit/erynoa_header_spec.rb
          spec/requests/ragfit/erynoa_header_spec.rb
