name: "Docs"

# RagFit fork: automatic triggers are DISABLED, not deleted. Lines prefixed "#RAGFIT-OFF# " are the
# original upstream triggers. Re-enable: `just ci-triggers on <file>` (removes the prefix). See README-RAGFIT-CI.md.
on:
  workflow_dispatch:
#RAGFIT-OFF#   pull_request:
#RAGFIT-OFF#     branches:
#RAGFIT-OFF#       - dev
#RAGFIT-OFF#       - release/*
#RAGFIT-OFF#     paths:
#RAGFIT-OFF#       - "docs/**"
#RAGFIT-OFF#       - "config/static_links.yml"

permissions:
  contents: read

jobs:
  docs-links-check:
    name: Check internal links in documentation
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true
      - run: bundle exec ./script/docs/check_links
  docs-readme-case-check:
    name: Check README.md case in documentation
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: script/docs/check_readme_case
  docs-readme-yaml-header-syntax-check:
    name: Check README.md YAML header syntax in documentation
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true
      - run: script/docs/check_readme_yaml_header_syntax
