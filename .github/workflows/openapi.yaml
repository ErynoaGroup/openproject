name: "OpenAPI"
# https://securitylab.github.com/research/github-actions-preventing-pwn-requests
# RagFit fork: automatic triggers are DISABLED, not deleted. Lines prefixed "#RAGFIT-OFF# " are the
# original upstream triggers. Re-enable: `just ci-triggers on <file>` (removes the prefix). See README-RAGFIT-CI.md.
on:
  workflow_dispatch:
#RAGFIT-OFF#   push:
#RAGFIT-OFF#     branches:
#RAGFIT-OFF#       - dev
#RAGFIT-OFF#       - release/*
#RAGFIT-OFF#     paths:
#RAGFIT-OFF#       - "docs/api/apiv3/**"
#RAGFIT-OFF#   pull_request:
#RAGFIT-OFF#     types: [opened, reopened, synchronize]
#RAGFIT-OFF#     paths:
#RAGFIT-OFF#       - "docs/api/apiv3/**"

jobs:
  api-spec:
    name: APIv3 specification (OpenAPI 3.0)
    if: github.repository_owner == 'opf'
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - run: ./script/api/validate_spec
