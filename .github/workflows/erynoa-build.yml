name: erynoa-build

# Build/sign/publish ONLY for releases (no push/pull_request triggers).
# Release tags have the form ragfit-plan-vX.Y.Z (own SemVer, set by `just release <major|minor|patch>`).
# Upstream tags vX.Y.Z, which the upstream sync pushes into this repo, deliberately do NOT match.
# GitHub-hosted runners only.
# Disabled (not deleted): build on every push to main. Re-enable: `just ci-triggers on erynoa-build.yml`.
on:
  push:
    tags: ["ragfit-plan-v*"]
#RAGFIT-OFF#     branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to build (ragfit-plan-vX.Y.Z), or a branch for guard_only"
        required: true
      guard_only:
        description: "Run only the guard job (no build, no push). Set false to build and publish the tag."
        type: boolean
        default: true

permissions: {}

concurrency:
  group: erynoa-build
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/erynoagroup/ragfit-plan

jobs:
  guard:
    # Same checks as `just ci-quick` (without the just dependency): leak guard, asset and notice guards, patch series.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: Trigger and runner check (no automatic triggers, GitHub-hosted runners only)
        run: ragfit/ci/trigger-check.sh
      - name: Leak guard (own files only in CI; diff/commit scan needs upstream tags, run `just ci-quick` locally)
        env:
          RAGFIT_LEAK_REQUIRE_EXTRA: "true"
          RAGFIT_LEAK_EXTRA: ${{ secrets.RAGFIT_LEAK_EXTRA }}   # internal names, never in the repo
        run: ragfit/ci/leak-guard.sh
      - name: Brand assets unchanged (ragfit/brand/PROVENANCE.md)
        run: ragfit/ci/asset-guard.sh
      - name: Upstream license notices unchanged (vs. upstream tag of lib/open_project/version.rb)
        run: |
          set -euo pipefail
          f=lib/open_project/version.rb
          v="$(sed -nE 's/^ *MAJOR = ([0-9]+).*/\1/p' $f).$(sed -nE 's/^ *MINOR = ([0-9]+).*/\1/p' $f).$(sed -nE 's/^ *PATCH = ([0-9]+).*/\1/p' $f)"
          git fetch --no-tags --depth=1 origin "refs/tags/v${v}:refs/tags/v${v}"
          UPSTREAM_REF="v${v}" ragfit/ci/notice-guard.sh
      - name: Patch series applied and documented
        run: |
          set -euo pipefail
          for p in ragfit/patches/*.patch; do
            git apply -R --check --exclude=CHANGES-RAGFIT.md "$p"  # CHANGES is a living log, later entries break exact reverse-apply
            grep -q "$(basename "$p")" CHANGES-RAGFIT.md
          done

  meta:
    needs: guard
    # guard_only (default for manual runs) stops here: meta, build and publish are skipped.
    if: github.event_name == 'push' || inputs.guard_only == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      short: ${{ steps.v.outputs.short }}
      epoch: ${{ steps.v.outputs.epoch }}
      upstream: ${{ steps.v.outputs.upstream }}
      upstream_version: ${{ steps.v.outputs.upstream_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
          persist-credentials: false
      - id: v
        env:
          REF_NAME: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          # Release version = own SemVer from the tag ragfit-plan-vX.Y.Z (no upstream version in the tag).
          [[ "$REF_NAME" =~ ^ragfit-plan-v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "not a release tag: $REF_NAME" >&2; exit 1; }
          version="${BASH_REMATCH[1]}"
          # Upstream base (labels and release notes only): lib/open_project/version.rb + upstream tag commit.
          f=lib/open_project/version.rb
          up="$(sed -nE 's/^ *MAJOR = ([0-9]+).*/\1/p' $f).$(sed -nE 's/^ *MINOR = ([0-9]+).*/\1/p' $f).$(sed -nE 's/^ *PATCH = ([0-9]+).*/\1/p' $f)"
          upsha=$(git ls-remote origin "refs/tags/v${up}^{}" "refs/tags/v${up}" | awk 'NR==1{print substr($1,1,7)}')
          [ -n "$upsha" ] || { echo "upstream tag v${up} not found" >&2; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "upstream_version=v${up}" >> "$GITHUB_OUTPUT"
          echo "upstream=openproject@v${up}/${upsha}" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          echo "version ${version}, upstream openproject@v${up}/${upsha}"

  build:
    needs: meta
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space (image build is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
        with:
          context: .
          file: docker/prod/Dockerfile
          target: slim
          platforms: ${{ matrix.platform }}
          # same as upstream 17.x-slim images (see image history)
          build-args: |
            BIM_SUPPORT=false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.base.name=openproject:${{ needs.meta.outputs.upstream_version }}
            ragfit.upstream=${{ needs.meta.outputs.upstream }}
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.title=RagFit | Plan
            org.opencontainers.image.description=RagFit | Plan, based on OpenProject (GPLv3); modifications listed in CHANGES-RAGFIT.md
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          cache-from: type=gha,scope=slim-${{ matrix.arch }}
          cache-to: type=gha,scope=slim-${{ matrix.arch }},mode=max
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create multi-arch manifest
        id: manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:${{ needs.meta.outputs.version }}" \
            -t "${IMAGE}:sha-${{ needs.meta.outputs.short }}" \
            $(printf "${IMAGE}@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "${IMAGE}:sha-${{ needs.meta.outputs.short }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### ${IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-ragfit-plan.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Sign and attest (keyless, GitHub OIDC)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
      - name: Verify
        env:
          REF: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          # accept old and new repository name (rename openproject -> ragfit-plan)
          id="^https://github.com/${{ github.repository_owner }}/(openproject|ragfit-plan)/\.github/workflows/erynoa-build\.yml@"
          cosign verify "$REF" --certificate-identity-regexp "$id" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          cosign verify-attestation "$REF" --type spdxjson --certificate-identity-regexp "$id" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "cosign verify OK"

  release:
    needs: [meta, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: GitHub release "RagFit | Plan vX.Y.Z"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ragfit-plan-v${{ needs.meta.outputs.version }}
          VERSION: ${{ needs.meta.outputs.version }}
          UPSTREAM: ${{ needs.meta.outputs.upstream }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "Image: \`${IMAGE}:${VERSION}\`" \
            "Digest: \`${IMAGE}@${DIGEST}\`" \
            "" \
            "Upstream base: ${UPSTREAM}" \
            "" \
            "Signed with cosign (keyless); SPDX SBOM attached as signed attestation. Changes: CHANGES-RAGFIT.md." > notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "RagFit | Plan v${VERSION}" --notes-file notes.md
