name: erynoa-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: erynoa-build
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/erynoagroup/openproject

jobs:
  meta:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      short: ${{ steps.v.outputs.short }}
      epoch: ${{ steps.v.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: v
        run: |
          set -euo pipefail
          # repo is ~3 GB: no full history. Version comes from upstream lib/open_project/version.rb.
          f=lib/open_project/version.rb
          major=$(sed -nE 's/^ *MAJOR = ([0-9]+).*/\1/p' $f)
          minor=$(sed -nE 's/^ *MINOR = ([0-9]+).*/\1/p' $f)
          patch=$(sed -nE 's/^ *PATCH = ([0-9]+).*/\1/p' $f)
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          echo "version ${major}.${minor}.${patch}"

  build:
    needs: meta
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space (image build is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
        with:
          context: .
          file: docker/prod/Dockerfile
          target: slim
          platforms: ${{ matrix.platform }}
          # same as upstream 17.x-slim images (see image history)
          build-args: |
            BIM_SUPPORT=false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}-slim
            org.opencontainers.image.licenses=GPL-3.0-only
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          cache-from: type=gha,scope=slim-${{ matrix.arch }}
          cache-to: type=gha,scope=slim-${{ matrix.arch }},mode=max
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create multi-arch manifest
        id: manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:${{ needs.meta.outputs.version }}-slim" \
            -t "${IMAGE}:sha-${{ needs.meta.outputs.short }}" \
            $(printf "${IMAGE}@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "${IMAGE}:sha-${{ needs.meta.outputs.short }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### ${IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-openproject.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Sign and attest (keyless, GitHub OIDC)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
      - name: Verify
        env:
          REF: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          id="^https://github.com/${{ github.repository }}/\.github/workflows/erynoa-build\.yml@"
          cosign verify "$REF" --certificate-identity-regexp "$id" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          cosign verify-attestation "$REF" --type spdxjson --certificate-identity-regexp "$id" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "cosign verify OK"
